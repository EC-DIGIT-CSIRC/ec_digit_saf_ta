# Index-time field extractions for sourcetype digit:saf:parseddata:json.
# Each transform writes a field into the index (WRITE_META = true) so that
# filtering and | tstats aggregation read straight from the tsidx instead of
# JSON-parsing every raw event at search time.
#
# The indexed fields are prefixed with "saf_idx_" and use underscores only
# (e.g. saf_idx_module, saf_idx_data_pid). This follows the Splunk per-app
# field-naming convention, keeps the names valid as indexed field keys
# (indexed keys allow only [a-zA-Z0-9_]; dots can be rewritten by index-time
# key cleaning), and keeps them unique so their names never collide with the
# search-time KV_MODE=json fields (module, data.pid, ...). That avoids
# multivalued/duplicate values in the UI and prevents fields.conf
# (INDEXED = true) from affecting unrelated data on the same instance.
#
# Note: the transform stanza names below happen to match the field names they
# produce; stanza names and field names are separate namespaces, so this is
# intentional and harmless.

# --- Root fields ---
[saf_idx_module]
SOURCE_KEY = _raw
REGEX = "module"\s*:\s*"([^"]+)"
FORMAT = saf_idx_module::$1
WRITE_META = true

[saf_idx_timestamp_desc]
SOURCE_KEY = _raw
REGEX = "timestamp_desc"\s*:\s*"([^"]+)"
FORMAT = saf_idx_timestamp_desc::$1
WRITE_META = true

[saf_idx_case_id]
SOURCE_KEY = MetaData:Source
REGEX = /([^/]+)/parsed_data/
FORMAT = saf_idx_case_id::$1
WRITE_META = true

# --- data.* fields ---
[saf_idx_data_event_type]
SOURCE_KEY = _raw
REGEX = "event_type"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_event_type::$1
WRITE_META = true

[saf_idx_data_log_type]
SOURCE_KEY = _raw
REGEX = "log_type"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_log_type::$1
WRITE_META = true

[saf_idx_data_euid]
SOURCE_KEY = _raw
REGEX = "euid"\s*:\s*(\d+)
FORMAT = saf_idx_data_euid::$1
WRITE_META = true

[saf_idx_data_boot_uuid]
SOURCE_KEY = _raw
REGEX = "boot_uuid"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_boot_uuid::$1
WRITE_META = true

[saf_idx_data_process]
SOURCE_KEY = _raw
REGEX = "process"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_process::$1
WRITE_META = true

[saf_idx_data_pid]
SOURCE_KEY = _raw
REGEX = "pid"\s*:\s*(\d+)
FORMAT = saf_idx_data_pid::$1
WRITE_META = true

[saf_idx_data_subsystem]
SOURCE_KEY = _raw
REGEX = "subsystem"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_subsystem::$1
WRITE_META = true

[saf_idx_data_category]
SOURCE_KEY = _raw
REGEX = "category"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_category::$1
WRITE_META = true

[saf_idx_data_library]
SOURCE_KEY = _raw
REGEX = "library"\s*:\s*"([^"]+)"
FORMAT = saf_idx_data_library::$1
WRITE_META = true
