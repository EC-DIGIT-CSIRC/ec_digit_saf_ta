# Index-time field extractions for sourcetype digit:saf:parseddata:json.
# Each transform writes a field into the index (WRITE_META = true) so that
# filtering and | tstats aggregation read straight from the tsidx instead of
# JSON-parsing every raw event at search time. Paired with fields.conf
# (INDEXED = true) to suppress the duplicate KV_MODE=json extraction.

# --- Root fields ---
[saf_idx_module]
SOURCE_KEY = _raw
REGEX = "module"\s*:\s*"([^"]+)"
FORMAT = module::$1
WRITE_META = true

[saf_idx_timestampdesc]
SOURCE_KEY = _raw
REGEX = "timestamp_desc"\s*:\s*"([^"]+)"
FORMAT = timestamp_desc::$1
WRITE_META = true

[saf_idx_caseid]
SOURCE_KEY = MetaData:Source
REGEX = /([^/]+)/parsed_data/
FORMAT = case_id::$1
WRITE_META = true

# --- data.* fields (global scope, dotted names) ---
[saf_idx_data_event_type]
SOURCE_KEY = _raw
REGEX = "event_type"\s*:\s*"([^"]+)"
FORMAT = data.event_type::$1
WRITE_META = true

[saf_idx_data_log_type]
SOURCE_KEY = _raw
REGEX = "log_type"\s*:\s*"([^"]+)"
FORMAT = data.log_type::$1
WRITE_META = true

[saf_idx_data_euid]
SOURCE_KEY = _raw
REGEX = "euid"\s*:\s*(\d+)
FORMAT = data.euid::$1
WRITE_META = true

[saf_idx_data_boot_uuid]
SOURCE_KEY = _raw
REGEX = "boot_uuid"\s*:\s*"([^"]+)"
FORMAT = data.boot_uuid::$1
WRITE_META = true

[saf_idx_data_process]
SOURCE_KEY = _raw
REGEX = "process"\s*:\s*"([^"]+)"
FORMAT = data.process::$1
WRITE_META = true

[saf_idx_data_pid]
SOURCE_KEY = _raw
REGEX = "pid"\s*:\s*(\d+)
FORMAT = data.pid::$1
WRITE_META = true

[saf_idx_data_subsystem]
SOURCE_KEY = _raw
REGEX = "subsystem"\s*:\s*"([^"]+)"
FORMAT = data.subsystem::$1
WRITE_META = true

[saf_idx_data_category]
SOURCE_KEY = _raw
REGEX = "category"\s*:\s*"([^"]+)"
FORMAT = data.category::$1
WRITE_META = true

[saf_idx_data_library]
SOURCE_KEY = _raw
REGEX = "library"\s*:\s*"([^"]+)"
FORMAT = data.library::$1
WRITE_META = true
