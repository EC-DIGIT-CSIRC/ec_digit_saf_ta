# Mark the index-time extracted fields (see transforms.conf) as authoritative
# from the index. INDEXED = true tells the search layer to read these fields
# straight from the index and skip any search-time re-extraction for them.
#
# The fields use the "saf_idx_" prefix and underscores only, so their names
# are unique to this TA and are valid indexed field keys. Because no other
# data (and not the search-time KV_MODE=json fields) uses these names, this
# setting has no effect outside sourcetype digit:saf:parseddata:json.

[saf_idx_module]
INDEXED = true

[saf_idx_case_id]
INDEXED = true

[saf_idx_timestamp_desc]
INDEXED = true

[saf_idx_data_event_type]
INDEXED = true

[saf_idx_data_log_type]
INDEXED = true

[saf_idx_data_euid]
INDEXED = true

[saf_idx_data_boot_uuid]
INDEXED = true

[saf_idx_data_process]
INDEXED = true

[saf_idx_data_pid]
INDEXED = true

[saf_idx_data_subsystem]
INDEXED = true

[saf_idx_data_category]
INDEXED = true

[saf_idx_data_library]
INDEXED = true
