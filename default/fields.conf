# Mark the index-time extracted fields (see transforms.conf) as authoritative
# from the index. INDEXED = true skips the search-time KV_MODE=json
# re-extraction for these fields only, preventing multivalued duplicates.

[module]
INDEXED = true

[case_id]
INDEXED = true

[timestamp_desc]
INDEXED = true

[data.event_type]
INDEXED = true

[data.log_type]
INDEXED = true

[data.euid]
INDEXED = true

[data.boot_uuid]
INDEXED = true

[data.process]
INDEXED = true

[data.pid]
INDEXED = true

[data.subsystem]
INDEXED = true

[data.category]
INDEXED = true

[data.library]
INDEXED = true
